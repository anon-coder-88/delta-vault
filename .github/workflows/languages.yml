name: Honest Linguist report
on: [push, workflow_dispatch]
permissions:
  contents: read
  statuses: write
jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libicu-dev zlib1g-dev libcurl4-openssl-dev libssl-dev
      - run: gem install github-linguist --no-document
      - name: Analyze the committed tree using GitHub Linguist
        run: github-linguist --json > linguist-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: linguist-report
          path: linguist-report.json
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('linguist-report.json','utf8'));
            const sizes = Object.fromEntries(Object.entries(data).map(([name,value])=>[name,value.size]));
            const total = Object.values(sizes).reduce((a,b)=>a+b,0);
            const percent = total ? 100*(sizes.Solidity || 0)/total : 0;
            const description = `Linguist Solidity ${percent.toFixed(2)}%; 50% target ${percent>=50?'met':'NOT met'}`;
            await core.summary.addHeading('Language composition').addRaw(description).addCodeBlock(JSON.stringify(data,null,2)).write();
            await github.rest.repos.createCommitStatus({...context.repo,sha:context.sha,state:percent>=50?'success':'failure',context:'analysis/solidity-share',description,target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
