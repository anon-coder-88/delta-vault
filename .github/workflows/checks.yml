name: Utility checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - run: npm run compile
      - run: npm test
      - run: npx tsc --noEmit
      - run: node --check web/app.js
      - run: python -m py_compile helpers/*.py
      - run: npm run languages
