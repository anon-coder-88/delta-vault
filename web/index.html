<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeltaVault utility</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body><main><header><h1>DeltaVault utility</h1><button id="connect">Connect Wallet</button></header>
<p>Testnet liquidity and leveraged positions. Owner-set prices; test assets only.</p>
<label>Wallet <select id="wallet"><option>No wallet detected</option></select></label>
<label>Market <select id="market"><option>BTC-USD</option><option>ETH-USD</option></select></label>
<section><h2>Liquidity</h2><label>Collateral amount <input id="amount" type="number" min="0" step="0.000001" value="100"></label>
<button data-action="faucet">Claim test USD</button><button data-action="approve">Approve amount</button><button data-action="deposit">Deposit</button>
<label>Shares to redeem <input id="shares" type="number" min="0" step="0.000001" value="100"></label><button data-action="withdraw">Withdraw shares</button></section>
<section><h2>Position</h2><label>Leverage <input id="leverage" type="number" min="1" max="5" step="1" value="2"></label>
<label>Direction <select id="direction"><option value="long">Long</option><option value="short">Short</option></select></label><button data-action="open">Open position</button>
<label>Position ID <input id="position" type="number" min="1" step="1" value="1"></label><button data-action="close">Close position</button><button data-action="liquidate">Liquidate unhealthy position</button></section>
<button id="refresh">Refresh market</button><pre id="state">Deploy the contracts to generate config.json.</pre><p id="status" role="status" aria-live="polite"></p>
</main></body></html>
